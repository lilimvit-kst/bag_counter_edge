services:
  # Redis for Celery broker and WebSocket message store
  redis:
    image: redis:7-alpine
    container_name: bag_counter_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  edge-cv:
    build: .
    container_name: bag_counter_cv
    restart: unless-stopped
    # Edge PC: use explicit ports to allow DNS resolution from other containers
    ports:
      - "8000:8000"   # FastAPI
      - "8765:8765"   # WebSocket
    # For RTSP cameras on host, ensure camera IPs are reachable from container
    # If cameras are on host network only, you may need network_mode: host instead
    env_file:
      - .env
    environment:
      - PRIMARY_STREAM_URL=${CAMERA_SOURCE:-rtsp://192.168.1.100:554/stream1}
      - SECONDARY_STREAM_URL=${SECONDARY_STREAM_URL:-}
      - CAMERA_WIDTH=${CAMERA_WIDTH:-1920}
      - CAMERA_HEIGHT=${CAMERA_HEIGHT:-1080}
      - CAMERA_FPS=${CAMERA_FPS:-30}
      - YOLO_MODEL_PATH=${YOLO_MODEL_PATH:-models/yolov8n.pt}
      - CONFIDENCE_THRESHOLD=${CONFIDENCE_THRESHOLD:-0.5}
      - IOU_THRESHOLD=${IOU_THRESHOLD:-0.45}
      - TRIPWIRE_Y_RATIO=${TRIPWIRE_Y_RATIO:-0.75}
      - HANDOVER_DISAPPEAR_FRAMES=${HANDOVER_DISAPPEAR_FRAMES:-10}
      - ROI_X1_RATIO=${ROI_X1_RATIO:-0.1}
      - ROI_X2_RATIO=${ROI_X2_RATIO:-0.9}
      - ROI_Y1_RATIO=${ROI_Y1_RATIO:-0.2}
      - ROI_Y2_RATIO=${ROI_Y2_RATIO:-0.9}
      - NVR_PRE_EVENT_DURATION=${NVR_PRE_EVENT_DURATION:-5}
      - NVR_POST_EVENT_DURATION=${NVR_POST_EVENT_DURATION:-10}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ENABLED=true
      - WEBSOCKET_ENABLED=true
      - USE_GUI=false
      # Security: require API_SECRET_KEY in production
      - API_SECRET_KEY=${API_SECRET_KEY:-change-me-in-production}
      - API_ADMIN_USER=${API_ADMIN_USER:-${ADMIN_USERNAME:-admin}}
      - API_ADMIN_PASS=${API_ADMIN_PASS:-${ADMIN_PASSWORD:-changeme}}
      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Force CUDA usage
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
    gpus: all
    deploy:
      resources:
        limits:
          cpus: "1.8"
          memory: 4G
        reservations:
          cpus: "0.8"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker for background tasks
  celery-worker:
    build: .
    container_name: bag_counter_celery_worker
    restart: unless-stopped
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ./storage:/app/storage
      - ./src:/app/src
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Celery Beat for periodic tasks (cleanup, stats update)
  celery-beat:
    build: .
    container_name: bag_counter_celery_beat
    restart: unless-stopped
    command: celery -A src.tasks.celery_app beat --loglevel=info
    # The shared image's HTTP health check belongs only to edge-cv.
    healthcheck:
      disable: true
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ./src:/app/src
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # Nginx reverse proxy for unified access
  nginx:
    image: nginx:alpine
    container_name: bag_counter_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - edge-cv
      - dashboard
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Operator dashboard; the former Streamlit image remains an opt-in maintenance tool.
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.operator
    container_name: bag_counter_dashboard
    restart: unless-stopped
    # No external port - accessed via nginx
    depends_on:
      - redis
      - edge-cv
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Optional: local NVR as separate lightweight container
  nvr:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: bag_counter_nvr
    restart: unless-stopped
    # Use bridge network instead of host to stay in same Docker network
    # If RTSP cameras are only accessible via host network, uncomment network_mode: host
    # network_mode: host
    env_file:
      - .env
    command: >
      ffmpeg -hide_banner -loglevel error
      -rtsp_transport tcp
      -i ${CAMERA_SOURCE:-rtsp://192.168.1.100:554/stream1}
      -c copy -f segment
      -segment_time 600
      -strftime 1
      -reset_timestamps 1
      /app/storage/nvr/%Y%m%d_%H%M%S.mp4
    volumes:
      - ./storage/nvr:/app/storage/nvr
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - edge-cv
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  redis_data:
