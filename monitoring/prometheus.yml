# Prometheus configuration for Bag Counter Edge

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'bag-counter-edge'

# Scrape configurations
scrape_configs:
  # Main application metrics
  - job_name: 'bag-counter-edge'
    static_configs:
      - targets: ['edge-cv:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    
  # Redis exporter (optional - requires redis-exporter service)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
    
  # Node exporter for host metrics (optional)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

# Alerting rules (optional)
