version: "3.9"

services:
  # Redis for Celery broker and WebSocket message store
  redis:
    image: redis:7-alpine
    container_name: bag_counter_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  edge-cv:
    build: .
    container_name: bag_counter_cv
    restart: unless-stopped
    # Edge PC: access host network for RTSP cameras
    network_mode: host
    # Or use explicit ports if host network unavailable:
    # ports:
    #   - "8000:8000"   # FastAPI
    #   - "8501:8501"   # Streamlit kiosk
    #   - "8765:8765"   # WebSocket
    environment:
      - PRIMARY_STREAM_URL=${PRIMARY_STREAM_URL:-rtsp://192.168.1.100:554/stream1}
      - SECONDARY_STREAM_URL=${SECONDARY_STREAM_URL:-rtsp://192.168.1.101:554/stream1}
      - FPS=${FPS:-25}
      - DETECTION_MODEL=${DETECTION_MODEL:-yolov8n.pt}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_ENABLED=true
      - WEBSOCKET_ENABLED=true
      # Security: require API_SECRET_KEY in production
      - API_SECRET_KEY=${API_SECRET_KEY:-change-me-in-production}
      - API_ADMIN_USER=${API_ADMIN_USER:-admin}
      - API_ADMIN_PASS=${API_ADMIN_PASS:-admin}
      # Logging configuration
      - LOG_FORMAT=json
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Celery Worker for background tasks
  celery-worker:
    build: .
    container_name: bag_counter_celery_worker
    restart: unless-stopped
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ./storage:/app/storage
      - ./src:/app/src
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Celery Beat for periodic tasks (cleanup, stats update)
  celery-beat:
    build: .
    container_name: bag_counter_celery_beat
    restart: unless-stopped
    command: celery -A src.tasks.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ./src:/app/src
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # Streamlit Operator Dashboard
  dashboard:
    build: .
    container_name: bag_counter_dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "src/kiosk/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - WEBSOCKET_URL=ws://localhost:8765
    volumes:
      - ./storage:/app/storage
      - ./src:/app/src
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Optional: local NVR as separate lightweight container
  nvr:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: bag_counter_nvr
    restart: unless-stopped
    network_mode: host
    command: >
      ffmpeg -hide_banner -loglevel error
      -rtsp_transport tcp
      -i ${PRIMARY_STREAM_URL:-rtsp://192.168.1.100:554/stream1}
      -c copy -f segment
      -segment_time 600
      -strftime 1
      -reset_timestamps 1
      /app/storage/nvr/%Y%m%d_%H%M%S.mp4
    volumes:
      - ./storage/nvr:/app/storage/nvr
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  redis_data:
